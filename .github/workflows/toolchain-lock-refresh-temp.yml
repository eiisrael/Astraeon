name: Toolchain Lock Refresh Temp

on:
  push:
    branches: ['agent/toolchain-refresh-20260903']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install refreshed dependencies
        run: npm ci --no-audit
      - name: Rebuild vendored Supabase bundle
        run: npm run build:vendor
      - name: Show versions
        run: |
          node -v
          npm -v
          npx --yes vercel@59.11.2 --version
          npm exec -- supabase --version
      - name: Commit generated files
        run: |
          if ! git diff --quiet -- package-lock.json src/vendor/supabase-v2.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json src/vendor/supabase-v2.js
            git commit -m "chore: atualizar lockfile e vendor"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload generated files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: astraeon-toolchain-generated
          path: |
            package-lock.json
            src/vendor/supabase-v2.js
          if-no-files-found: error
          retention-days: 1
