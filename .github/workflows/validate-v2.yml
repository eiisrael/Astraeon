name: Validate Astraeon Online 7.0 Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify vendored Supabase bundle
        run: |
          npm run build:vendor
          git diff --exit-code -- src/vendor/supabase-v2.js
      - name: Scan tracked files for secrets
        run: python3 scripts/check_secrets.py
      - name: Validate JavaScript syntax
        run: |
          node --check src/world-v2.js
          node --check src/game-v2.js
          node --check src/inventory-v2.js
          node --check src/inventory-v3.js
          node --check src/inventory-layout-v43.js
          node --check src/ui-v3.js
          node --check src/gameplay-polish-v7.js
          node --check src/systems-v3b.js
          node --check src/admin-runtime-v3c.js
          node --check src/world-online-v4.js
          node --check src/npcs-v4.js
          node --check src/realtime-security-v1.js
          node --check src/multiplayer-v4.js
          node --check src/online-controller-v4.js
          node --check src/combat-focus-v4.js
          node --check src/chat-system-v4.js
          node --check src/live-runtime-v5.js
          node --check src/production-runtime-v6.js
          node --check src/character-system-v6.js
          node --check src/worldmaps-runtime-v61.js
          node --check src/server-config-v62.js
          node --check src/menu-cinematic-v62.js
          node --check src/account-status-v4.js
          node --check api/config.js
          node --check api/admin-access.js
          node --check src/editor-diagnostics-v5.js
          node --check src/editor-v2.js
          node --check src/admin-v3c.js
          node --check src/admin-studio-v4.js
          node --check src/admin-auth-v4.js
          node --check src/admin-accounts-v4.js
          node --check src/admin-system-messages-v4.js
          node --check src/admin-live-tools-v5.js
          node --check src/admin-character-slots-v6.js
          node --check src/admin-production-v6.js
          node --check src/admin-worldmaps-v61.js
          node --check src/admin-realtime-v62.js
          node --check src/admin-server-config-v62.js
      - name: Validate security contracts and hostile Realtime payloads
        run: npm run test:security
      - name: Validate HTML, access contracts, admin and deployment config
        run: python3 scripts/validate_v2.py
      - name: Validate connected maps and MobList contracts
        run: python3 scripts/validate_worldmaps_v61.py
      - name: Validate cinematic menu and realtime admin contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'src/menu-cinematic-v62.js': [
                  'Assets/img/logo/logo.png',
                  'Assets/img/logo/logoA.png',
                  'Assets/img/logo/favicon.png',
                  'Assets/img/song/login.mp3',
                  'menu-session-offline',
                  'systemAnnouncementV5',
              ],
              'src/admin-realtime-v62.js': [
                  'admin_backups',
                  'worldMapCanvasStripV62',
                  'world-map-delete',
                  'item_configs',
                  'INTERNAL_LOOT',
                  'saveActiveMap',
              ],
              'src/admin-server-config-v62.js': ['admin_runtime_config', 'astraeon:v3c:admin'],
              'src/server-config-v62.js': ['admin_runtime_config', 'postgres_changes'],
              'supabase/migrations/009_admin_realtime_backups.sql': [
                  'create table if not exists public.admin_backups',
                  'create table if not exists public.admin_runtime_config',
                  'cannot_delete_default_map',
              ],
              'supabase/migrations/010_inventory_standard_slots.sql': [
                  "'pet'",
                  "'cloak'",
                  "'offhand'",
                  "'legs'",
                  "'necklace'",
                  "item_id = 'wanderer_cloak'",
              ],
              'src/inventory-layout-v43.js': [
                  "label: 'Colar'",
                  "label: 'Pingente'",
                  "label: 'Anel'",
                  "label: 'Amuleto'",
                  'Peito / Armadura',
                  'Arma 2 / Escudo',
              ],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              missing = [n for n in needles if n not in text]
              if missing:
                  raise SystemExit(f'{path}: missing contracts: {missing}')
          auth = Path('src/admin-auth-v4.js').read_text(encoding='utf-8')
          for src in ('src/admin-realtime-v62.js','src/admin-server-config-v62.js'):
              if src not in auth:
                  raise SystemExit(f'admin loader missing {src}')
          ui = Path('src/ui-v3.js').read_text(encoding='utf-8')
          for src in ('src/server-config-v62.js','src/menu-cinematic-v62.js','src/gameplay-polish-v7.js','src/inventory-layout-v43.css'):
              if src not in ui:
                  raise SystemExit(f'game loader missing {src}')
          index = Path('index.html').read_text(encoding='utf-8')
          if 'src/inventory-layout-v43.js' not in index:
              raise SystemExit('game loader missing src/inventory-layout-v43.js')
          print('Astraeon 6.2 contracts OK')
          PY
      - name: Start disposable Supabase and apply every migration
        run: npm exec -- supabase start
      - name: Test database authorization and isolation with pgTAP
        run: npm run test:db
      - name: Lint the migrated database
        run: npm exec -- supabase db lint --local --level warning --fail-on error
      - name: Stop disposable Supabase
        if: always()
        run: npm exec -- supabase stop --no-backup
