name: Validate Astraeon Online

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check src/world-v2.js
          node --check src/game-v2.js
          node --check src/inventory-v2.js
          node --check src/inventory-v3.js
          node --check src/ui-v3.js
          node --check src/systems-v3b.js
          node --check src/admin-runtime-v3c.js
          node --check src/world-online-v4.js
          node --check src/npcs-v4.js
          node --check src/multiplayer-v4.js
          node --check api/config.js
          node --check src/editor-v2.js
          node --check src/admin-v3c.js
      - name: Validate HTML, online contracts and deployment config
        run: python3 scripts/validate_v2.py
