<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRAEON — Genesis Game Editor 3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-darker: #03050a;
  --bg-dark: #070b14;
  --bg-card: rgba(13, 19, 35, 0.75);
  --border: rgba(101, 217, 255, 0.15);
  --border-active: rgba(101, 217, 255, 0.45);
  --text: #f1f5f9;
  --muted: #8899ac;
  --cyan: #65d9ff;
  --cyan-glow: rgba(101, 217, 255, 0.25);
  --gold: #f0c75d;
  --gold-glow: rgba(240, 199, 93, 0.25);
  --green: #6de39b;
  --red: #ff6678;
  --purple: #c08cff;
  --shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: var(--bg-darker); color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  overflow: hidden; font-size: 13px;
}

button, input, select, textarea { font-family: inherit; }

/* Custom scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
::-webkit-scrollbar-thumb { background: rgba(101, 217, 255, 0.25); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

.app {
  display: flex; flex-direction: column; height: 100vh; width: 100vw;
}

/* Header */
header.top {
  height: 52px; background: rgba(6, 10, 20, 0.95);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; padding: 0 16px;
  backdrop-filter: blur(12px); z-index: 100;
}
.brand {
  font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 18px;
  letter-spacing: 0.12em; color: #fff; display: flex; align-items: center; gap: 8px;
  text-shadow: 0 0 12px var(--cyan-glow);
}
.brand small {
  font-size: 10px; color: var(--cyan); font-weight: 600;
  background: rgba(101, 217, 255, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border);
}
.grow { flex: 1; }

.status {
  display: flex; align-items: center; gap: 8px; font-size: 11px;
  color: var(--muted); background: rgba(0,0,0,0.3); padding: 5px 12px;
  border-radius: 99px; border: 1px solid var(--border);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot.dirty { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.dot.bad { background: var(--red); box-shadow: 0 0 8px var(--red); }

/* Buttons */
.btn {
  padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  color: var(--text); font-weight: 600; font-size: 12px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.18s ease; letter-spacing: 0.02em;
}
.btn:hover {
  transform: translateY(-1px); border-color: var(--cyan);
  box-shadow: 0 4px 16px var(--cyan-glow); background: rgba(101, 217, 255, 0.15);
}
.btn.primary {
  border-color: rgba(240, 199, 93, 0.5);
  background: linear-gradient(180deg, rgba(240, 199, 93, 0.25), rgba(240, 199, 93, 0.08));
  color: #fff; text-shadow: 0 1px 2px #000;
}
.btn.primary:hover { border-color: var(--gold); box-shadow: 0 4px 16px var(--gold-glow); }
.btn.good {
  border-color: rgba(109, 227, 155, 0.5);
  background: linear-gradient(180deg, rgba(109, 227, 155, 0.25), rgba(109, 227, 155, 0.08));
}
.btn.danger {
  border-color: rgba(255, 102, 120, 0.5);
  background: linear-gradient(180deg, rgba(255, 102, 120, 0.25), rgba(255, 102, 120, 0.08));
  color: var(--red);
}
.btn.tiny { padding: 4px 8px; font-size: 10px; border-radius: 6px; }

/* Main Layout */
.main { flex: 1; display: grid; grid-template-columns: 220px 1fr 340px; overflow: hidden; }

/* Sidebar Navigation */
aside.side {
  background: var(--bg-dark); border-right: 1px solid var(--border);
  padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
}
.navtitle {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--muted); font-weight: 700; margin: 14px 8px 6px;
}
.nav {
  padding: 10px 12px; border-radius: 10px; border: 1px solid transparent;
  background: transparent; color: var(--muted); text-align: left;
  font-weight: 600; font-size: 12px; cursor: pointer; transition: all 0.15s ease;
  display: flex; align-items: center; gap: 10px;
}
.nav:hover { background: rgba(255, 255, 255, 0.04); color: var(--text); }
.nav.active {
  background: linear-gradient(90deg, rgba(101, 217, 255, 0.18), rgba(101, 217, 255, 0.04));
  border-color: var(--border-active); color: var(--cyan); font-weight: 700;
  box-shadow: inset 3px 0 0 var(--cyan);
}

/* Center Content */
section.center {
  background: var(--bg-darker); display: flex; flex-direction: column; overflow: hidden;
}
.centerbar {
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; background: rgba(8, 14, 28, 0.5);
}
.centerbar h2 { margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; color: #fff; }
.search {
  background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 12px; color: var(--text); font-size: 12px; outline: none; width: 200px; transition: all 0.2s;
}
.search:focus { border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan-glow); }

.viewport { flex: 1; padding: 20px; overflow-y: auto; }

/* Inspector Panel */
aside.inspector {
  background: var(--bg-dark); border-left: 1px solid var(--border);
  padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
}
.inspector h3 { margin: 0 0 10px; font-family: 'Outfit', sans-serif; font-size: 16px; color: var(--gold); }

/* Card & Grid UI */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; box-shadow: var(--shadow);
  backdrop-filter: blur(8px); transition: border-color 0.2s;
}
.card:hover { border-color: rgba(101, 217, 255, 0.3); }
.card.full { grid-column: 1 / -1; }
.card h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--cyan); }
.notice {
  padding: 10px 14px; border-radius: 10px; background: rgba(101, 217, 255, 0.08);
  border: 1px solid var(--border); font-size: 11px; color: #b0e5ff; line-height: 1.5; margin-bottom: 12px;
}
.notice.success { background: rgba(109, 227, 155, 0.1); border-color: rgba(109, 227, 155, 0.3); color: #a4f0c4; }

/* Form Fields */
.field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
.field label .tag { font-size: 9px; color: var(--cyan); text-transform: uppercase; background: rgba(101,217,255,0.1); padding: 1px 4px; border-radius: 3px; }
.field input[type="text"], .field input[type="number"], .field select, .field textarea {
  background: rgba(4, 8, 16, 0.7); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; color: var(--text); font-size: 12px; outline: none; transition: border-color 0.15s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); }
.field input[type="color"] { width: 100%; height: 34px; padding: 2px; background: rgba(4,8,16,0.7); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.field .check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; color: var(--text); }
.field .range { display: flex; align-items: center; gap: 10px; }
.field .range input[type="range"] { flex: 1; accent-color: var(--cyan); cursor: pointer; }
.field .range output { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); min-width: 32px; text-align: right; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Entity & Item Items */
.entity {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  border-radius: 10px; background: rgba(255,255,255,0.025); border: 1px solid var(--border); margin-bottom: 6px;
}
.entity strong { font-size: 13px; color: #fff; flex: 1; }
.tag { padding: 2px 6px; border-radius: 4px; font-size: 10px; background: rgba(255,255,255,0.06); color: var(--muted); }
.item-thumb { width: 34px; height: 34px; object-fit: contain; border-radius: 6px; background: #030610; border: 1px solid var(--border); }
.asset-preview { max-width: 100%; max-height: 120px; object-fit: contain; border-radius: 8px; border: 1px solid var(--border); background: #020409; margin-top: 6px; }

/* Logic Nodes */
.logic { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.logic .node { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: rgba(255,255,255,0.02); }
.node b { display: block; color: var(--cyan); font-size: 10px; text-transform: uppercase; margin-bottom: 4px; }
.node select { width: 100%; background: #040812; color: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 4px; }

/* Live Frame Floating Window */
.iframeWrap {
  position: fixed; right: 20px; bottom: 40px; width: 420px; height: 320px;
  background: rgba(8, 12, 24, 0.95); border: 1px solid var(--border-active);
  border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  display: flex; flex-direction: column; overflow: hidden; z-index: 900;
  opacity: 0; pointer-events: none; transform: translateY(20px); transition: opacity 0.25s, transform 0.25s;
}
.iframeWrap.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.iframeHead {
  height: 34px; background: rgba(14, 22, 42, 0.9); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; padding: 0 12px; cursor: move; user-select: none;
}
.iframeHead strong { font-size: 11px; color: var(--gold); letter-spacing: 0.05em; }
.gameframe { flex: 1; border: none; width: 100%; height: 100%; background: #05070e; }

/* Biomes Grid */
.biomes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }

@media (max-width: 1100px) {
  .main { grid-template-columns: 180px 1fr; }
  .inspector { display: none; }
}
</style>
</head>

<main class="main">
<aside class="side">

  <button class="nav" data-section="quests">📜 Missões & Quests</button>
  <button class="nav" data-section="items">🎒 Catálogo de Itens</button>
  <button class="nav" data-section="combat">⚔️ Tuning de Combate</button>
  <button class="nav" data-section="ai">🧠 Inteligência Artificial</button>
  <div class="navtitle">Mundo & Arte</div>

  <button class="nav" data-section="page">🧩 Elementos de Página</button>
  <button class="nav" data-section="logic">🔗 Lógicas (Logic)</button>
  <div class="navtitle">Suporte</div>
  <button class="nav" data-section="help">❔ Ajuda & Manual</button>
</aside>
<section class="center">

  <div class="viewport" id="viewport"></div>
</section>
<aside class="inspector" id="inspector"></aside>
</main>
<footer style="border-top:1px solid var(--border);padding:0 14px;color:var(--muted);font-size:10px;display:flex;justify-space-between;align-items:center;background:var(--bg-darker);height:28px;">
  <span>Offline • Genesis Core Studio Engine 3.0</span>
  <span id="fileName" style="font-family:'JetBrains Mono',monospace;">Autodetectando index.html...</span>
</footer>
</div>

<div class="iframeWrap" id="frameWrap">
  <div class="iframeHead"><strong>LIVE PREVIEW GAME WINDOW</strong><span class="grow"></span><button class="btn tiny" id="reloadFrame">↻ Recarregar</button><button class="btn tiny" id="closeFrame">×</button></div>
  <iframe id="gameFrame" class="gameframe" title="Live Preview"></iframe>
</div>

<input type="file" id="fallbackFile" accept=".html,text/html" hidden>
<input type="file" id="assetFile" accept=".png,.gif,image/png,image/gif" hidden>
<input type="file" id="classAssetFile" accept=".png,.gif,image/png,image/gif" hidden>
<input type="file" id="itemAssetFile" accept=".png,.gif,image/png,image/gif" hidden>

let config = deepClone(DEFAULT_CONFIG), fileHandle = null, indexText = "", activeSection = "dashboard", selectedType = "Slime", selectedClass = "Warrior", selectedNPC = 0, selectedQuest = 0, selectedWeapon = 0, selectedItem = 0, selectedLogic = 0;
const HANDLE_DB = "GENESIS_EDITOR_DB", HANDLE_STORE = "handles", HANDLE_KEY = "indexHandle";

const $ = id => document.getElementById(id);
function deepClone(v) { return JSON.parse(JSON.stringify(v)); }

function setStatus(t, bad = false) {
  $("status").textContent = t;
  const dot = $("statusDot");
  if(dot) dot.className = bad ? "dot dirty" : "dot";
  $("status").style.color = bad ? "#ff6678" : "#94a3b8";
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function get(path) {
  return path.split(".").reduce((a, k) => a?.[k], config);
}

function set(path, value) {
  const p = path.split(".");
  let o = config;
  for (let i = 0; i < p.length - 1; i++) {
    if (!o[p[i]] || typeof o[p[i]] !== "object") o[p[i]] = {};
    o = o[p[i]];
  }
  o[p[p.length - 1]] = value;
  dirty();
  if (activeSection === "player") drawPlayerPreview();
}

function dirty() {
  setStatus("Alterações pendentes (Salvar index.html para confirmar)", true);
}

/* IndexedDB File Handle Storage */
function openHandleDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return resolve(null);
    const req = indexedDB.open(HANDLE_DB, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(HANDLE_STORE))
        req.result.createObjectStore(HANDLE_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function persistFileHandle(handle) {
  try {
    const db = await openHandleDB();
    if (!db) return;
    await new Promise((resolve, reject) => {
      const tx = db.transaction(HANDLE_STORE, "readwrite");
      tx.objectStore(HANDLE_STORE).put(handle, HANDLE_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  } catch (e) { console.warn(e); }
}

async function getPersistedFileHandle() {
  try {
    const db = await openHandleDB();
    if (!db) return null;
    const h = await new Promise((resolve, reject) => {
      const tx = db.transaction(HANDLE_STORE, "readonly");
      const req = tx.objectStore(HANDLE_STORE).get(HANDLE_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return h;
  } catch (e) { return null; }
}

async function loadFromHandle(h, auto = false) {
  try {
    if (!h) return false;
    const perm = await h.queryPermission({ mode: "readwrite" });
    if (perm !== "granted") {
      if (auto) {
        setStatus("index.html detectado • Clique em Salvar para conceder gravação direta", false);
        const f = await h.getFile();
        fileHandle = h;
        indexText = await f.text();
        $("fileName").textContent = f.name;
        extractEmbedded();
        return true;
      }
      const asked = await h.requestPermission({ mode: "readwrite" });
      if (asked !== "granted") return false;
    }
    fileHandle = h;
    const f = await h.getFile();
    indexText = await f.text();
    $("fileName").textContent = f.name;
    extractEmbedded();
    showFrame();
    setStatus("index.html restaurado automaticamente");
    return true;
  } catch (e) {
    console.warn(e);
    return false;
  }
}

async function autoLoadIndex() {
  try {
    const response = await fetch("index.html");
    if (response.ok) {
      const text = await response.text();
      if (text.includes("/* GENESIS_CONFIG_START */")) {
        indexText = text;
        $("fileName").textContent = "index.html (Autodetectado localmente)";
        extractEmbedded();
        showFrame();
        setStatus("index.html carregado automaticamente!", false);
        return true;
      }
    }
  } catch (e) {
    console.warn("Auto-load via fetch failed. Tentando IndexedDB...", e);
  }
  return false;
}

async function restoreLastIndex() {
  const loaded = await autoLoadIndex();
  if (loaded) return;
  const h = await getPersistedFileHandle();
  if (h) {
    await loadFromHandle(h, true);
  } else {
    setStatus("Pronto — Use 📂 Abrir ou 💾 Salvar index.html", false);
  }
}

function showFrame() {
  const wrap = $("frameWrap");
  const frame = $("gameFrame");
  if (!wrap || !frame) return;
  wrap.classList.add("show");
  if (indexText) {
    const blob = new Blob([indexText], { type: "text/html" });
    frame.src = URL.createObjectURL(blob);
  } else {
    frame.src = "index.html";
  }
}

/* UI Form Field Builder */
function field(label, path, type = "number", opts = {}) {
  const v = get(path);
  let input = "";
  if (type === "select") {
    input = `<select data-path="${path}">${opts.options.map(x => `<option value="${esc(x)}" ${String(x) === String(v) ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>`;
  } else if (type === "color") {
    input = `<input type="color" data-path="${path}" value="${esc(v || "#ffffff")}">`;
  } else if (type === "checkbox") {
    input = `<label class="check"><input type="checkbox" data-path="${path}" ${v ? "checked" : ""}> Ativado</label>`;
  } else if (type === "textarea") {
    input = `<textarea rows="3" data-path="${path}">${esc(v)}</textarea>`;
  } else if (type === "range") {
    input = `<div class="range"><input type="range" data-path="${path}" min="${opts.min ?? 0}" max="${opts.max ?? 100}" step="${opts.step ?? 1}" value="${Number(v)}"><output>${Number(v)}</output></div>`;
  } else {
    input = `<input type="${type}" data-path="${path}" value="${esc(v)}" ${opts.min !== undefined ? `min="${opts.min}"` : ""} ${opts.max !== undefined ? `max="${opts.max}"` : ""} ${opts.step !== undefined ? `step="${opts.step}"` : ""}>`;
  }
  return `<div class="field"><label>${label}<span class="tag">${type}</span></label>${input}</div>`;
}

function assetPicker(label, path, presets = [], uploadAction = "") {
  const v = get(path) || "";
  const opts = presets.map(p => `<option value="${esc(p.value)}" ${String(p.value) === String(v) ? "selected" : ""}>${esc(p.label)}</option>`).join("");
  return `
    <div class="field">
      <label>${label}<span class="tag">image</span></label>
      <select class="asset-preset-select" data-path="${path}">
        ${opts}
        <option value="__custom__" ${v && !presets.some(p => p.value === v) ? "selected" : ""}>Customizado (Base64/Caminho)</option>
      </select>
      <input type="text" data-path="${path}" value="${esc(v)}" placeholder="Caminho ou Data URL..." style="margin-top:6px;">
      <div style="display:flex;gap:6px;margin-top:6px;">
        ${uploadAction ? `<button class="btn good tiny" data-action="${uploadAction}">📁 Importar PNG/GIF</button>` : ''}
        ${v ? `<button class="btn danger tiny" data-clear-path="${path}">× Limpar Imagem</button>` : ''}
      </div>
      ${v ? `<img class="asset-preview" src="${v}" style="margin-top:8px;" onerror="this.style.display='none'">` : ''}
    </div>
  `;
}

function card(title, body, cls = "") {
  return `<div class="card ${cls}"><h3>${title}</h3>${body}</div>`;
}

function bindFields() {
  document.querySelectorAll("[data-path]").forEach(el => {
    const ev = el.type === "range" || el.type === "color" ? "input" : "change";
    el.addEventListener(ev, () => {
      let v = el.type === "checkbox" ? el.checked : el.value;
      if (el.type === "number" || el.type === "range") v = Number(v);
      set(el.dataset.path, v);
      const out = el.parentElement?.querySelector("output");
      if (out) out.textContent = v;
    });
  });
  document.querySelectorAll(".asset-preset-select").forEach(sel => {
    sel.addEventListener("change", () => {
      if (sel.value !== "__custom__") {
        set(sel.dataset.path, sel.value);
        render();
      }
    });
  });
  document.querySelectorAll("[data-clear-path]").forEach(b => {
    b.onclick = () => {
      set(b.dataset.clearPath, "");
      render();
    };
  });
  document.querySelectorAll("[data-action]").forEach(b => {
    b.onclick = () => actions[b.dataset.action]?.(b);
  });
}

/* Actions handlers */
const actions = {
  showGame() { showFrame(); },
  reset() {
    if (confirm("Restaurar todas as configurações para o padrão original?")) {
      config = deepClone(DEFAULT_CONFIG);
      dirty(); render(); applyLive();
    }
  },
  selectClass(b) { selectedClass = b.dataset.value; render(); },
  removeClass(b) {
    const k = b.dataset.value;
    if (confirm("Remover classe " + k + "?")) {
      delete config.classes[k];
      if (selectedClass === k) selectedClass = Object.keys(config.classes)[0];
      dirty(); render();
    }
  },
  addClass() {
    let n = prompt("Nome da nova classe:", "Gladiador");
    if (!n) return;
    let base = deepClone(config.classes.Warrior);
    base.skill = "Nova Habilidade";
    config.classes[n] = base;
    selectedClass = n;
    dirty(); render();
  },
  selectMonster(b) { selectedType = b.dataset.value; ensureMonsterStat(selectedType); render(); },
  addMonster() {

    selectedType = n;
    dirty(); render();

  selectNPC(b) { selectedNPC = Number(b.dataset.value); render(); },

let activeGraphicTarget = "player";
function ensureMonsterStat(n) { if (!config.monsterStats[n]) config.monsterStats[n] = { hp: 60, attack: 12, defense: 5, speed: 60, xp: 40 }; }

function getSelectedVisual() {
  if (activeGraphicTarget === "player") return config.visuals.player;
  if (activeGraphicTarget === "monster") return config.visuals.monsters[selectedType];
  const n = config.npcs[selectedNPC];
  if (!n) return null;
  const key = n.id || n.type;
  if (!config.visuals.npcs[key]) config.visuals.npcs[key] = deepClone(config.visuals.npcs[n.type] || { color: "#d8d8e8", scale: 1, shape: "sage", glow: false, image: "" });
  return config.visuals.npcs[key];
}

function readAssetFile(file) {
  if (!file || !/^(image\/png|image\/gif)$/i.test(file.type)) { alert("Selecione um arquivo PNG ou GIF transparente."); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const target = getSelectedVisual();
    if (!target) return;
    target.image = reader.result;
    dirty(); render();
  };
  reader.readAsDataURL(file);
}

function readClassAssetFile(file) {
  if (!file || !/^(image\/png|image\/gif)$/i.test(file.type)) { alert("Selecione um arquivo PNG ou GIF."); return; }
  const reader = new FileReader();
  reader.onload = () => {
    if (!config.classes[selectedClass]) return;
    config.classes[selectedClass].image = reader.result;
    dirty(); render();
  };
  reader.readAsDataURL(file);
}

function readItemAssetFile(file) {
  if (!file || !/^(image\/png|image\/gif)$/i.test(file.type)) { alert("PNG ou GIF transparentes."); return; }
  ensureItemCatalog();
  const reader = new FileReader();
  reader.onload = () => {
    const it = config.items.catalog[selectedItem];
    if (!it) return;
    it.image = reader.result;
    dirty(); render();
  };
  reader.readAsDataURL(file);
}

function drawPlayerPreview() {
  const c = $("playerCanvasPreview"); if (!c) return;
  const x = c.getContext("2d"), w = c.width, h = c.height;
  x.clearRect(0, 0, w, h); x.fillStyle = "#030610"; x.fillRect(0, 0, w, h);
  const d = config.visuals.player || {};
  const cx = w / 2, cy = h / 2, scale = Number(d.scale || 1.15), r = 40 * scale;
  const color = d.color || "#00f2fe", outline = d.outline || "#fff", glow = !!d.glow;
  x.save(); x.translate(cx, cy);
  if (glow) { x.shadowBlur = 20; x.shadowColor = color; }
  if (d.image) {
    const im = new Image();
    im.onload = () => {
      x.clearRect(-w / 2, -h / 2, w, h);
      x.fillStyle = "#030610"; x.fillRect(-w/2, -h/2, w, h);
      x.shadowBlur = glow ? 20 : 0;
      x.drawImage(im, -r, -r, r * 2, r * 2);
      x.restore();
    };
    im.src = d.image;
    return;
  }
  x.fillStyle = color; x.strokeStyle = outline; x.lineWidth = 2.5;
  x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); x.fill(); x.stroke();
  x.restore();
}

/* Terrain Brush Canvas Implementation */
let terrainBrushState = { isPainting: false };
function initTerrainBrushCanvas() {
  const canvas = $("terrainBrushCanvas"); if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const cols = 50, rows = 30, tileSize = 16;
  canvas.width = cols * tileSize; canvas.height = rows * tileSize;

  if (!config.world) config.world = {};
  if (!config.world.paintedTerrain) config.world.paintedTerrain = {};

  const BIOME_COLORS = {
    grass: "#304a32", forest: "#233b2a", plain: "#66734c", mountain: "#5e6268",
    desert: "#9b7b48", swamp: "#354b43", snow: "#aebbc2", volcano: "#4d2c29",
    ruins: "#48475b", water: "#1b4560", road: "#756548", village: "#4b493b"
  };

  function renderTerrainCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const painted = config.world.paintedTerrain || {};

    let count = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const gridX = c - Math.floor(cols / 2);
        const gridY = r - Math.floor(rows / 2);
        const key = gridX + "," + gridY;
        const val = painted[key];

        let col = "#233b2a";
        if ((r + c) % 2 === 0) col = "#294430";

        if (val) {
          count++;
          col = BIOME_COLORS[val] || val;
        }

        ctx.fillStyle = col;
        ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);

        if (val) {
          ctx.strokeStyle = "rgba(255,255,255,0.25)";
          ctx.strokeRect(c * tileSize + 0.5, r * tileSize + 0.5, tileSize - 1, tileSize - 1);
        }
      }
    }

    /* Grid overlay lines */
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.lineWidth = 1;
    for (let c = 0; c <= cols; c++) { ctx.beginPath(); ctx.moveTo(c * tileSize, 0); ctx.lineTo(c * tileSize, canvas.height); ctx.stroke(); }
    for (let r = 0; r <= rows; r++) { ctx.beginPath(); ctx.moveTo(0, r * tileSize); ctx.lineTo(canvas.width, r * tileSize); ctx.stroke(); }

    const stats = $("paintedStats");
    if (stats) stats.textContent = count + " células pintadas fixas";
  }

  function handleBrushEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const col = Math.floor(mx / tileSize);
    const row = Math.floor(my / tileSize);
    if (col < 0 || col >= cols || row < 0 || row >= rows) return;

    const gridX = col - Math.floor(cols / 2);
    const gridY = row - Math.floor(rows / 2);

    const tool = $("brushTool")?.value || "paint";
    const size = parseInt($("brushSize")?.value || "3");
    const biomeSel = $("brushBiome")?.value || "volcano";
    const colorHex = $("brushColor")?.value || "#4d2c29";
    const colorVal = biomeSel === "__custom__" ? colorHex : biomeSel;

    const half = Math.floor(size / 2);
    for (let dx = -half; dx <= half; dx++) {
      for (let dy = -half; dy <= half; dy++) {
        const targetX = gridX + dx;
        const targetY = gridY + dy;
        const key = targetX + "," + targetY;
        if (tool === "paint") {
          config.world.paintedTerrain[key] = colorVal;
        } else if (tool === "eraser") {
          delete config.world.paintedTerrain[key];
        }
      }
    }
    dirty();
    renderTerrainCanvas();
    applyLive();
  }

  canvas.onpointerdown = e => {
    terrainBrushState.isPainting = true;
    canvas.setPointerCapture?.(e.pointerId);
    handleBrushEvent(e);
  };
  canvas.onpointermove = e => {
    if (terrainBrushState.isPainting) handleBrushEvent(e);
  };
  const stopPainting = e => {
    terrainBrushState.isPainting = false;
  };
  canvas.onpointerup = stopPainting;
  canvas.onpointercancel = stopPainting;

  renderTerrainCanvas();
}

async function openIndex() {
  try {
    if (window.showOpenFilePicker) {
      const [h] = await showOpenFilePicker({ multiple: false, types: [{ description: "Jogo HTML (index.html)", accept: { "text/html": [".html"] } }] });
      fileHandle = h;
      await persistFileHandle(h);
      indexText = await (await h.getFile()).text();
    } else {
      $("fallbackFile").click(); return;
    }
    $("fileName").textContent = fileHandle?.name || "index.html";
    extractEmbedded();
    showFrame();
    setStatus("index.html aberto com sucesso", false);
  } catch (e) {
    if (e.name !== "AbortError") setStatus("Falha ao ler arquivo", true);
  }
}

$("fallbackFile").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  indexText = await f.text();
  fileHandle = null;
  $("fileName").textContent = f.name + " (Modo Exportação)";
  extractEmbedded();
  showFrame();
  setStatus("Arquivo carregado com sucesso!");
});

function extractEmbedded() {
  if (!indexText) return;
  const m = indexText.match(/\/\* GENESIS_CONFIG_START \*\/([\s\S]*?)\/\* GENESIS_CONFIG_END \*\//);
  if (!m) return;
  const o = m[1].match(/const GENESIS_DEFAULT_CONFIG\s*=\s*([\s\S]*?);/);
  if (!o) return;
  try {
    const parsed = JSON.parse(o[1]);
    config = deepMerge(deepClone(DEFAULT_CONFIG), parsed);
    setStatus("Configurações importadas do index.html!", false);
  } catch (e) { console.warn(e); }
  render();
}

function deepMerge(a, b) {
  if (!b || typeof b !== "object") return a;
  for (const k of Object.keys(b)) {
    if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k])) {
      a[k] = deepMerge(a[k] || {}, b[k]);
    } else a[k] = b[k];
  }
  return a;
}

function applyLive() {
  localStorage.setItem("GENESIS_EDITOR_CONFIG", JSON.stringify(config));
  const f = $("gameFrame");
  if (f && f.contentWindow) f.contentWindow.postMessage({ type: "GENESIS_UPDATE", data: config }, "*");
  try { localStorage.setItem("GENESIS_RUNTIME_DATA", JSON.stringify(config)); } catch (e) { }
  setStatus("LIVE aplicado com sucesso", false);
}

function patchedIndex() {
  if (!indexText) {
    indexText = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>ASTRAEON</title></head><body><script>/* GENESIS_CONFIG_START */\nconst GENESIS_DEFAULT_CONFIG = {};\n/* GENESIS_CONFIG_END */<\/script></body></html>`;
  }
  const block = `/* GENESIS_CONFIG_START */\nconst GENESIS_DEFAULT_CONFIG = ${JSON.stringify(config, null, 2)};\n/* GENESIS_CONFIG_END */`;
  const re = /\/\* GENESIS_CONFIG_START \*\/[\s\S]*?\/\* GENESIS_CONFIG_END \*\//;
  if (!re.test(indexText)) {
    return indexText + `\n<script>\n${block}\n<\/script>`;
  }
  return indexText.replace(re, block);
}

async function saveIndex() {
  try {
    const text = patchedIndex();
    if (fileHandle && fileHandle.createWritable) {
      let perm = await fileHandle.queryPermission({ mode: "readwrite" });
      if (perm !== "granted") {
        try { perm = await fileHandle.requestPermission({ mode: "readwrite" }); } catch(e){}
      }
      if (perm === "granted") {
        const writable = await fileHandle.createWritable();
        await writable.write(text);
        await writable.close();
        indexText = text;
        await persistFileHandle(fileHandle);
        setStatus("✓ Edição Salva no index.html!", false);
        return;
      }
    }
    if (window.showSaveFilePicker) {
      try {
        const h = await showSaveFilePicker({
          suggestedName: "index.html",
          types: [{ description: "Jogo HTML (index.html)", accept: { "text/html": [".html"] } }]
        });
        fileHandle = h;
        await persistFileHandle(h);
        const writable = await h.createWritable();
        await writable.write(text);
        await writable.close();
        indexText = text;
        $("fileName").textContent = h.name;
        setStatus("✓ Edição Salva no index.html!", false);
        return;
      } catch (e) {
        if (e.name === "AbortError") return;
      }
    }
    download("index.html", text, "text/html");
    setStatus("✓ Edição Baixada (Salvo fallback)", false);
  } catch (e) {
    alert(e.message || "Erro ao salvar index.html.");
    setStatus("Falha ao salvar", true);
  }
}

function download(name, text, type) {
  const blob = new Blob([text], { type }), a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function exportIndex() {
  try {
    download("index.html", patchedIndex(), "text/html");
    setStatus("Cópia baixada com sucesso", false);
  } catch (e) { alert(e.message); }
}

function backup() {
  try {
    download("index.backup.html", indexText || patchedIndex(), "text/html");
    setStatus("Backup criado!", false);
  } catch (e) { alert(e.message); }
}

function searchNav() {
  const q = $("search").value.toLowerCase();
  document.querySelectorAll(".nav").forEach(b => {
    b.style.display = b.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}

document.querySelectorAll(".nav").forEach(b => b.addEventListener("click", () => {
  activeSection = b.dataset.section;
  render();
}));

$("search").addEventListener("input", searchNav);
$("openBtn").onclick = openIndex;
$("applyBtn").onclick = applyLive;
$("saveBtn").onclick = saveIndex;
$("exportBtn").onclick = exportIndex;
$("backupBtn").onclick = backup;
$("closeFrame").onclick = () => $("frameWrap").classList.remove("show");
$("reloadFrame").onclick = showFrame;

window.addEventListener("message", e => {
  if (e.data?.type === "GENESIS_READY") applyLive();
});

$("pageQuickBtn").addEventListener("click", () => {
  activeSection = "page";
  render();
});

$("assetFile").addEventListener("change", e => {
  const f = e.target.files?.[0]; if (f) readAssetFile(f); e.target.value = "";
});
$("classAssetFile").addEventListener("change", e => {
  const f = e.target.files?.[0]; if (f) readClassAssetFile(f); e.target.value = "";
});
$("itemAssetFile").addEventListener("change", e => {
  const f = e.target.files?.[0]; if (f) readItemAssetFile(f); e.target.value = "";
});

window.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveIndex(); return; }
  if (e.altKey && e.key.toLowerCase() === "p") { e.preventDefault(); activeSection = "page"; render(); }
});

(async () => {
  render();
  const loaded = await autoLoadIndex();
  if (!loaded) {
    setTimeout(restoreLastIndex, 120);
  }
})();

/* Drag and drop for floating live preview window */
(() => {
  const w = document.getElementById("frameWrap"), h = document.querySelector("#frameWrap .iframeHead");
  if (!w || !h) return;
  let drag = false, ox = 0, oy = 0;
  h.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    drag = true;
    const r = w.getBoundingClientRect();
    ox = e.clientX - r.left; oy = e.clientY - r.top;
    w.style.left = r.left + "px"; w.style.top = r.top + "px";
    w.style.right = "auto"; w.style.bottom = "auto"; w.style.transform = "none";
    h.setPointerCapture?.(e.pointerId);
  });
  h.addEventListener("pointermove", e => {
    if (!drag) return;
    w.style.left = Math.max(8, Math.min(innerWidth - w.offsetWidth - 8, e.clientX - ox)) + "px";
    w.style.top = Math.max(8, Math.min(innerHeight - w.offsetHeight - 8, e.clientY - oy)) + "px";
  });
  const stop = () => { drag = false; };
  h.addEventListener("pointerup", stop);
  h.addEventListener("pointercancel", stop);
})();
</script>
